[package]
name = "dmarket"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4.3"
reqwest = { version = "0.12.15", features = ["json", "native-tls"], default-features = false }
thiserror = "2.0.12"
url = "2.5.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_qs = "0.15.0"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
ringbuffer = "0.15.0"
sqlx = { version = "0.8.5", features = ["postgres", "runtime-tokio-native-tls", "uuid"] }
log = "0.4.27"
uuid = { version = "1.16.0", features = ["serde"] }
futures = "0.3.31"
async-stream = "0.3.6"
anyhow = "1.0.98"
common = { path = "../common" }
