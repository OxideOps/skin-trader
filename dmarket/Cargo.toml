[package]
name = "dmarket"
version = "0.1.0"
edition = "2021"

[dependencies]
hex = "0.4.3"
reqwest = { version = "0.13.1", features = ["json", "native-tls"], default-features = false }
thiserror = "2.0.17"
url = "2.5.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_qs = "0.15.0"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
ringbuffer = "0.16.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "uuid"] }
log = "0.4.29"
uuid = { version = "1.19.0", features = ["serde"] }
futures = "0.3.31"
async-stream = "0.3.6"
anyhow = "1.0.100"
common = { path = "../common" }
