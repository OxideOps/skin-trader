[package]
name = "lower-prices"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
common = { path = "../common" }
log = "0.4"
reqwest = { version = "0.13", features = ["json", "native-tls", "http2"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
